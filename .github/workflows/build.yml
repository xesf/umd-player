# Builds the host tools, the desktop players (macOS, Linux, Windows) and the Vita VPK on every
# push and pull request. A tag named v* also publishes a GitHub release with the VPK and the
# macOS, Linux and Windows packages, and sends the VPK to VitaDB.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y clang lz4
      - name: Build the host tools
        run: make -C tools CC=clang
      - name: Check the CSO and ZSO readers
        run: sh tools/image_check.sh
      - name: Run the app with an empty library
        run: |
          mkdir -p empty
          ./build/host/playtest empty 1

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Mac app (Apple silicon and Intel)
        run: make app ARCHS="arm64 x86_64"
      - name: Package
        run: |
          v=$(sed -n 's/.*UMDPLAYER_VERSION "\(.*\)".*/\1/p' src/app/version.h)
          mkdir -p pkg/umdplayer
          cp -R build/macos-universal/UMDPlayer.app pkg/umdplayer/
          cp LICENSE NOTICE src/core/atrac3p/COPYING.LGPLv2.1 pkg/umdplayer/
          cp docs/desktop.md pkg/umdplayer/README.md
          ditto -c -k --keepParent pkg/umdplayer umdplayer-v$v-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: umdplayer-macos
          path: umdplayer-v*-macos.zip

  # Built on the oldest supported Ubuntu, so the binary runs on any glibc from 2.35 on,
  # SteamOS included.
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install X11 and ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libasound2-dev
      - name: Build the Linux player
        run: make PLATFORM=linux
      - name: Package
        run: |
          v=$(sed -n 's/.*UMDPLAYER_VERSION "\(.*\)".*/\1/p' src/app/version.h)
          mkdir -p pkg/umdplayer
          cp build/linux/umdplayer LICENSE NOTICE src/core/atrac3p/COPYING.LGPLv2.1 pkg/umdplayer/
          cp docs/desktop.md pkg/umdplayer/README.md
          tar -C pkg -czf umdplayer-v$v-linux-x86_64.tar.gz umdplayer
      - uses: actions/upload-artifact@v4
        with:
          name: umdplayer-linux
          path: umdplayer-v*-linux-x86_64.tar.gz

  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 zip
      - name: Build the Windows player
        run: make PLATFORM=windows
      - name: Package
        run: |
          v=$(sed -n 's/.*UMDPLAYER_VERSION "\(.*\)".*/\1/p' src/app/version.h)
          mkdir -p pkg/umdplayer
          cp build/windows/umdplayer.exe LICENSE NOTICE src/core/atrac3p/COPYING.LGPLv2.1 pkg/umdplayer/
          cp docs/desktop.md pkg/umdplayer/README.md
          (cd pkg && zip -r ../umdplayer-v$v-windows-x86_64.zip umdplayer)
      - uses: actions/upload-artifact@v4
        with:
          name: umdplayer-windows
          path: umdplayer-v*-windows-x86_64.zip

  vita:
    runs-on: ubuntu-24.04
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the VPK
        run: |
          cmake -S . -B build/vita
          cmake --build build/vita
      - uses: actions/upload-artifact@v4
        with:
          name: umdplayer-vpk
          path: build/vita/umdplayer-v*.vpk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host, macos, linux, windows, vita]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: umdplayer-*
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" umdplayer-v*.vpk umdplayer-v*-macos.zip umdplayer-v*-linux-x86_64.tar.gz umdplayer-v*-windows-x86_64.zip \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
      # VitaDB copies the VPK from the release just published. The secret comes from the
      # app's VitaDB page; without it (forks) the step does nothing.
      - name: Publish to VitaDB
        env:
          VITADB_SECRET: ${{ secrets.VITA_SECRET }}
        run: |
          if [ -z "$VITADB_SECRET" ]; then
            echo "VITA_SECRET is not set: skipping VitaDB"
            exit 0
          fi
          curl --fail-with-body --show-error -X POST \
            -F "secret=$VITADB_SECRET" \
            -F "vpk_url=https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/umdplayer-$GITHUB_REF_NAME.vpk" \
            https://www.rinnegatamante.eu/vitadb/publish_nightly.php
